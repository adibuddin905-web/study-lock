name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pywebview pymupdf

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name StudyLock --collect-all webview --collect-all pythonnet --collect-all clr_loader --collect-all pymupdf --hidden-import clr study_lock.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyLock-windows
          path: dist/StudyLock.exe

      - name: Publish release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StudyLock.exe
