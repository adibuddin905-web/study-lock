name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pywebview pymupdf

      - name: Stamp build id
        shell: bash
        run: echo "BUILD_ID = '${{ github.sha }}'" > build_id.py

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name StudyLock --collect-all webview --collect-all pythonnet --collect-all clr_loader --collect-all pymupdf --hidden-import clr --hidden-import build_id study_lock.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyLock-windows
          path: dist/StudyLock.exe

      - name: Publish as the "latest" release (used by the in-app Update button)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: StudyLock (latest build)
          body: ${{ github.sha }}
          artifacts: dist/StudyLock.exe
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
